{% block content %}
{% include "header.html" %}

    <section id="add-blog">
        <table class="table table-dark table-hover">
            <thead>

                <th scope="row">Title</th>
                <th scope="row">Blog Content</th>
                <th scope="row">Add Photo</th>
                <th scope="row">Post</th>
            </thead>
            <tbody>
                    <form action="" method="post" enctype="multipart/form-data">
                        {{ form.hidden_tag() }}
                        <td>{{ form.title }}</td>
                        <td>{{ form.body }}</td>
                        <td>{{ form.blog_photo }}</td>
                        <td>{{ form.post() }}</td>
                    </form>
            </tbody>
        </table>
    </section>

 {% include "footer.html"%}{% endblock %}
